<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETL Exercise</title>
</head>
<body>
<h1>Maurice Fontanosa</h1>
<p><i>IT 3206N [MW 6:00 - 8:30]</i></p>

<br>
<h1>ETL Exercise</h1>

<h2>1. Upload Source CSV Files</h2>

<p>Student Information System (SIS):</p>
<input id="sisFile" type="file" accept=".csv,text/csv">

<p>Learning Management System (LMS):</p>
<input id="lmsFile" type="file" accept=".csv,text/csv">

<p>Accounting System:</p>
<input id="accountingFile" type="file" accept=".csv,text/csv">

<br><br>
<button id="runBtn">RUN ETL</button>
<p id="status" role="status" aria-live="polite">Upload the three CSV files and click RUN ETL.</p>

<h2>2. JSON Output</h2>
<button id="downloadBtn" disabled>DOWNLOAD JSON</button>
<button id="copyBtn" disabled>COPY JSON</button>
<pre id="jsonOutput">Upload the CSV files and click RUN ETL.</pre>

<script>
const $ = (id) => document.getElementById(id);
let latestOutput = null;

function parseCSV(text) {
  // Handles quoted fields, commas inside quotes, escaped quotes, and CRLF/LF.
  const rows = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (quoted) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else {
      if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== '\r') field += c;
    }
  }
  row.push(field);
  if (row.some(v => v.length) || !rows.length) rows.push(row);
  const headers = (rows.shift() || []).map(h => h.replace(/^\uFEFF/, "").trim());
  return rows.filter(r => r.some(v => String(v).trim() !== "")).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] ?? ""));
    return obj;
  });
}

function clean(value) { return String(value ?? "").trim(); }
function properName(value) {
  return clean(value).toLowerCase().replace(/\s+/g, " ")
    .replace(/\b([a-z])/g, ch => ch.toUpperCase());
}
function normalizeStatus(value) {
  const s = clean(value).toLowerCase().replace(/[\s_-]+/g, " ");
  if (!s) return "";
  if (["completed", "complete", "done", "finished"].includes(s)) return "Completed";
  if (["in progress", "ongoing", "inprogress"].includes(s)) return "In Progress";
  if (["not started", "pending", "incomplete"].includes(s)) return "Pending";
  return s.replace(/\b([a-z])/g, ch => ch.toUpperCase());
}
function toNumber(value, label) {
  const s = clean(value).replace(/,/g, "");
  if (!s) return null;
  const n = Number(s);
  if (!Number.isFinite(n)) throw new Error(`${label} must be numeric. Invalid value: "${value}"`);
  return n;
}
function toStudentId(value) {
  const s = clean(value);
  if (!/^\d+$/.test(s)) throw new Error(`Student ID "${value}" must contain digits only.`);
  const n = Number(s);
  if (!Number.isSafeInteger(n)) throw new Error(`Student ID "${value}" is outside the safe integer range.`);
  return n;
}
const programMap = {
  BSIT: "Bachelor of Science in Information Technology",
  BSCS: "Bachelor of Science in Computer Science",
  BSIS: "Bachelor of Science in Information Systems"
};
function getField(row, field, source) {
  if (!(field in row)) throw new Error(`${source} CSV is missing the required "${field}" column.`);
  return row[field];
}

async function readFile(inputId, source) {
  const file = $(inputId).files[0];
  if (!file) throw new Error(`Please select the ${source} CSV file.`);
  return parseCSV(await file.text());
}

function runETL(sisRows, lmsRows, accountingRows) {
  const students = new Map();
  const unmatchedRecords = { lms: [], accounting: [] };

  for (const row of sisRows) {
    const studentId = toStudentId(getField(row, "student_id", "SIS"));
    if (students.has(studentId)) throw new Error(`Duplicate SIS student_id: ${studentId}`);
    const rawProgram = clean(getField(row, "program_code", "SIS")).toUpperCase();
    students.set(studentId, {
      studentId,
      studentName: properName(getField(row, "student_name", "SIS")),
      program: programMap[rawProgram] || rawProgram,
      emailAddress: clean(getField(row, "email", "SIS")).toLowerCase(),
      courses: [],
      accounting: null
    });
  }

  for (const row of lmsRows) {
    const rawId = getField(row, "student_id", "LMS");
    const id = toStudentId(rawId);
    const courseCode = clean(getField(row, "course_code", "LMS")).toUpperCase();
    const rawGrade = clean(getField(row, "final_grade", "LMS"));
    const numericGrade = rawGrade === "" ? null : (Number.isFinite(Number(rawGrade)) ? Number(rawGrade) : rawGrade);
    const course = {
      courseCode,
      finalGrade: numericGrade,
      completionStatus: normalizeStatus(getField(row, "completion_status", "LMS"))
    };
    if (students.has(id)) students.get(id).courses.push(course);
    else unmatchedRecords.lms.push({ studentId: id, ...course });
  }

  for (const row of accountingRows) {
    const rawId = getField(row, "student_id", "Accounting");
    const id = toStudentId(rawId);
    const balance = toNumber(getField(row, "account_balance", "Accounting"), "Account balance");
    const currency = clean(getField(row, "currency", "Accounting")).toUpperCase();
    const record = { outstandingBalance: balance, currency };
    if (students.has(id)) {
      if (students.get(id).accounting !== null) throw new Error(`Duplicate Accounting record for student_id: ${id}`);
      students.get(id).accounting = record;
    } else unmatchedRecords.accounting.push({ studentId: id, ...record });
  }

  return {
    generatedAt: new Date().toISOString(),
    students: Array.from(students.values()),
    unmatchedRecords
  };
}

$("runBtn").addEventListener("click", async () => {
  $("runBtn").disabled = true;
  $("status").className = "";
  $("status").textContent = "Processing CSV files…";
  try {
    const [sis, lms, accounting] = await Promise.all([
      readFile("sisFile", "SIS"),
      readFile("lmsFile", "LMS"),
      readFile("accountingFile", "Accounting")
    ]);
    latestOutput = runETL(sis, lms, accounting);
    $("jsonOutput").textContent = JSON.stringify(latestOutput, null, 2);
    $("downloadBtn").disabled = false;
    $("copyBtn").disabled = false;
    $("status").className = "success";
    $("status").textContent = `ETL completed successfully. ${latestOutput.students.length} SIS student record(s) processed; ${latestOutput.unmatchedRecords.lms.length + latestOutput.unmatchedRecords.accounting.length} unmatched record(s) preserved.`;
  } catch (err) {
    latestOutput = null;
    $("downloadBtn").disabled = true;
    $("copyBtn").disabled = true;
    $("status").className = "error";
    $("status").textContent = err.message || "Unable to process the CSV files.";
  } finally {
    $("runBtn").disabled = false;
  }
});

$("downloadBtn").addEventListener("click", () => {
  if (!latestOutput) return;
  const blob = new Blob([JSON.stringify(latestOutput, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "integrated_student_data.json"; a.click();
  URL.revokeObjectURL(url);
});
$("copyBtn").addEventListener("click", async () => {
  if (!latestOutput) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(latestOutput, null, 2));
    $("status").className = "success";
    $("status").textContent = "JSON copied to clipboard.";
  } catch {
    $("status").className = "error";
    $("status").textContent = "Clipboard access was blocked by the browser. You can select and copy the JSON output manually.";
  }
});
$("clearBtn").addEventListener("click", () => {
  ["sisFile", "lmsFile", "accountingFile"].forEach(id => $(id).value = "");
  latestOutput = null;
  $("jsonOutput").textContent = "Upload the CSV files and click RUN ETL.";
  $("status").className = "";
  $("status").textContent = "Upload all three CSV files and click RUN ETL.";
  $("downloadBtn").disabled = $("copyBtn").disabled = false;
  $("downloadBtn").disabled = true;
  $("copyBtn").disabled = true;
});
</script>
</body>
</html>
